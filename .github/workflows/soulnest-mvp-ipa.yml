name: SoulNest MVP IPA

on:
  push:
    branches:
      - soulnest-mvp-to-ipa
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Prepare build customization
        run: |
          cp src/ios/Configs/ProviderCustomization.xcconfig.example \
             src/ios/Configs/ProviderCustomization.xcconfig

      - name: Install native build prerequisites
        run: |
          brew install ninja llvm libarchive pkg-config meson || true
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix libarchive)/bin" >> "$GITHUB_PATH"

      - name: Cache native iOS dependencies
        uses: actions/cache@v4
        with:
          path: |
            deps/lame-build
            deps/frameworks
            deps/libs
            deps/include
            deps/resources
          key: soulnest-ios-native-${{ runner.os }}-${{ hashFiles('deps/build_lame.sh', 'deps/build_ffmpeg.sh', 'deps/build_ish.sh', 'deps/prepare_alpine_rootfs.sh', '.gitmodules') }}

      - name: Build native dependencies
        run: |
          ./deps/build_lame.sh
          ./deps/build_ffmpeg.sh
          ./deps/build_ish.sh
          ./deps/prepare_alpine_rootfs.sh

      - name: Archive unsigned device build
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild \
            -project src/ios/Minis.xcodeproj \
            -scheme Minis \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/SoulNest.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM='' \
            archive | tee build/xcodebuild.log

      - name: Package unsigned IPA
        run: |
          APP_PATH="$PWD/build/SoulNest.xcarchive/Products/Applications/Minis.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Expected app not found: $APP_PATH" >&2
            find build -maxdepth 6 -name '*.app' -print || true
            exit 1
          fi

          # Untouched unsigned archive payload: useful for build inspection.
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          (cd build && /usr/bin/zip -qry SoulNest-unsigned.ipa Payload)

          # Functional test package for the user's current acceptance path:
          # LiveContainer does not normally host guest app extensions, so strip
          # PlugIns from this copy and give the guest a distinct SoulNest identity.
          # This is packaging-only; source-level bundle/app-group branding remains
          # tracked separately under #19.
          rm -rf build/LivePayload
          mkdir -p build/LivePayload
          cp -R "$APP_PATH" build/LivePayload/SoulNest.app
          rm -rf build/LivePayload/SoulNest.app/PlugIns
          INFO=build/LivePayload/SoulNest.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Set :CFBundleIdentifier com.wildenstudio.soulnest' "$INFO"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleName SoulNest' "$INFO" || true
          /usr/libexec/PlistBuddy -c 'Delete :CFBundleDisplayName' "$INFO" >/dev/null 2>&1 || true
          /usr/libexec/PlistBuddy -c 'Add :CFBundleDisplayName string SoulNest' "$INFO"
          mv build/LivePayload build/Payload-LiveContainer
          (cd build && mv Payload Payload-original && mv Payload-LiveContainer Payload && /usr/bin/zip -qry SoulNest-LiveContainer.ipa Payload && mv Payload Payload-LiveContainer && mv Payload-original Payload)

          /usr/bin/stat -f 'Unsigned IPA bytes: %z' build/SoulNest-unsigned.ipa
          /usr/bin/stat -f 'LiveContainer IPA bytes: %z' build/SoulNest-LiveContainer.ipa

      - name: Upload IPA and build log
        uses: actions/upload-artifact@v4
        with:
          name: SoulNest-ipa
          path: |
            build/SoulNest-LiveContainer.ipa
            build/SoulNest-unsigned.ipa
            build/xcodebuild.log
          if-no-files-found: error
          retention-days: 7
